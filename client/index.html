<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserve — budget your energy</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--g1:#0d0d0e;--g2:#1a1a1c;--g3:#3a3a3e;--g4:#8a8a90;--g5:#d4d4d8;--w:#fafafa;--red:#e5484d;
--glass:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);box-sizing:border-box;color-scheme:dark;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--g5);font:400 15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
#glow{position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;left:0;top:0;
background:radial-gradient(circle,rgba(255,255,255,.09),transparent 65%);transform:translate(-50%,-50%);transition:opacity .4s;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:36px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
h1{font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--w)}
h1 small{display:block;font-weight:300;font-size:13px;color:var(--g4);letter-spacing:0}
.pill{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--g4);backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:26px;padding:26px;
backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 30px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.07);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.35),transparent 60%);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;animation:in 1s .1s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.ringbox{position:relative;width:270px;height:270px;margin:6px 0 14px}
svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .track{stroke:var(--g2)}
.ring .bar{stroke:url(#gr);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1),stroke .6s;filter:drop-shadow(0 0 12px rgba(255,255,255,.55))}
.ring.debt .bar{stroke:var(--red);filter:drop-shadow(0 0 14px rgba(229,72,77,.7))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:64px;font-weight:300;color:var(--w);letter-spacing:-.04em;line-height:1;text-shadow:0 0 30px rgba(255,255,255,.35)}
.num span{font-size:24px;color:var(--g4)}
.state{margin-top:8px;font-size:13px;color:var(--g4)}
.verdict{max-width:34ch;color:var(--g5);min-height:46px;font-weight:300}
.tmr{margin-top:16px;width:100%;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;font-size:13px;color:var(--g4)}
.tmr b{color:var(--w);font-weight:600}
h2{font-size:14px;font-weight:600;color:var(--w);margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--g5);border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;transition:.25s}
.chip:hover{border-color:rgba(255,255,255,.35);box-shadow:0 0 18px rgba(255,255,255,.12);transform:translateY(-2px)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--g5);outline-offset:2px}
input[type=text]{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--w);font:inherit;margin-bottom:16px;transition:.25s}
input[type=text]:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 22px rgba(255,255,255,.1);outline:none}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--g4);margin-bottom:8px}
.row b{color:var(--w);font-weight:600}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:9px;background:var(--g3);margin:6px 0 14px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--w);box-shadow:0 0 18px rgba(255,255,255,.8);cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--w);box-shadow:0 0 18px rgba(255,255,255,.8)}
.proj{font-size:13px;color:var(--g4);margin-bottom:16px;min-height:20px;transition:color .3s}
.proj.warn{color:var(--red)}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;color:#000;background:linear-gradient(135deg,#fff,#a8a8ae);cursor:pointer;transition:.3s;box-shadow:0 0 30px rgba(255,255,255,.18)}
.btn:hover{box-shadow:0 0 44px rgba(255,255,255,.4);transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.full{grid-column:1/-1}
#chart{width:100%;height:170px;display:block;overflow:visible}
.led{list-style:none;padding:0;margin-top:6px;max-height:340px;overflow-y:auto}
.led li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.led li.new{animation:slide .6s cubic-bezier(.2,.8,.2,1) both}
.led .nm{flex:1}.led .t{font-size:12px;color:var(--g4)}
.led .d{font-weight:600;min-width:52px;text-align:right}
.led .d.pos{color:var(--w);text-shadow:0 0 14px rgba(255,255,255,.5)}.led .d.neg{color:var(--g4)}
.x{background:none;border:0;color:var(--g3);cursor:pointer;font-size:18px;transition:.2s}.x:hover{color:var(--red)}
.empty{color:var(--g4);padding:20px 0;text-align:center;font-weight:300}
.foot{display:flex;gap:10px;margin-top:14px}
.ghost{flex:1;background:var(--glass);border:1px solid var(--line);color:var(--g5);border-radius:12px;padding:10px;font:inherit;font-size:13px;cursor:pointer;transition:.25s}
.ghost:hover{border-color:rgba(255,255,255,.35)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.btn,.chip,.ghost{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .7s ease-out forwards;pointer-events:none}
.btn .rip{background:rgba(0,0,0,.22)}@keyframes rp{to{transform:scale(1);opacity:0}}
.verdict{transition:opacity .25s}
.tip{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tip::after{content:"";position:absolute;left:50%;top:19px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 18px 4px rgba(255,255,255,.8)}
.ringbox.debt .tip::after{background:var(--red);box-shadow:0 0 18px 4px rgba(229,72,77,.8)}
.ringbox.pulse{animation:pulse .8s cubic-bezier(.2,.8,.2,1)}
@keyframes pulse{30%{transform:scale(1.045);filter:drop-shadow(0 0 28px rgba(255,255,255,.35))}}
.fl{position:absolute;left:50%;top:36%;font-size:30px;font-weight:600;pointer-events:none;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) forwards;text-shadow:0 0 20px currentColor}
.fl.p{color:#fff}.fl.n{color:var(--g4)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}to{opacity:0;transform:translate(-50%,-90px)}}
.plan{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--g4);margin-bottom:16px;cursor:pointer}
.plan input{accent-color:#fafafa;width:16px;height:16px}
.led li.pl{opacity:.6}.ok{background:none;border:0;color:var(--g4);cursor:pointer;font-size:16px;transition:.2s}.ok:hover{color:var(--w);text-shadow:0 0 12px #fff}
.foot{flex-wrap:wrap}
.sdlg{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--g4);animation:in .5s both}
.sdlg[hidden]{display:none}.sdlg input{flex:1;margin:0}.sdlg b{color:var(--w);min-width:44px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.st{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;transition:.35s cubic-bezier(.2,.8,.2,1)}
.st:hover{border-color:rgba(255,255,255,.3);transform:translateY(-3px);box-shadow:0 0 28px rgba(255,255,255,.1)}
.st small{display:block;color:var(--g4);font-size:12px}.st b{display:block;font-size:21px;color:var(--w);font-weight:600;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.st em{font-style:normal;font-size:12px;color:var(--g4)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:130px}
.wd{display:flex;flex-direction:column;gap:6px;align-items:center}.wd small{color:var(--g4);font-size:12px}
.bw{flex:1;width:100%;max-width:46px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.bw i{display:block;width:100%;border-radius:10px;background:rgba(255,255,255,.1);animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bw i.on{background:linear-gradient(#fff,#8a8a90);box-shadow:0 0 18px rgba(255,255,255,.35)}.bw i.neg{background:var(--red)}
@keyframes grow{from{height:0}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:99px;background:rgba(20,20,22,.82);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--w);font-size:13px;transition:.45s cubic-bezier(.2,.8,.2,1);z-index:9;pointer-events:none;box-shadow:0 20px 50px #000,0 0 30px rgba(255,255,255,.08);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

.fld{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--w);font:inherit;margin-bottom:12px;transition:.25s}
.fld:focus{border-color:rgba(255,255,255,.4);outline:none;box-shadow:0 0 22px rgba(255,255,255,.1)}
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s}
.modal[hidden]{display:none}.mbox{width:min(380px,92vw);animation:in .5s both}@keyframes fade{from{opacity:0}}
.mlink{background:none;border:0;color:var(--g4);cursor:pointer;font:inherit;font-size:13px;margin-top:12px;width:100%}.mlink:hover{color:var(--w)}
.merr{color:var(--red);font-size:13px;min-height:20px;margin-bottom:8px}
.rep{font-weight:300;line-height:1.7}.rep p{margin-bottom:8px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="glow"></div>
<div class="wrap">
<header>
  <h1>Reserve<small>Spend your energy like money. See the overdraft before it happens.</small></h1>
  <div style="display:flex;gap:10px;align-items:center"><div class="pill" id="date"></div><button class="pill" id="acct" style="cursor:pointer;font:inherit">Sign in</button></div>
</header>

<div class="grid">
  <section class="card hero">
    <div class="ringbox" id="rb"><div class="tip" id="tip"></div>
      <svg class="ring" id="ring" viewBox="0 0 200 200">
        <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#8a8a90"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="86"/>
        <circle class="bar" id="bar" cx="100" cy="100" r="86" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
      </svg>
      <div class="center"><div class="num"><span id="n">0</span><span>%</span></div><div class="state" id="state">Reserve</div></div>
    </div>
    <p class="verdict" id="verdict"></p>
    <div class="tmr"><span>Forecast by night <b id="fc">100%</b></span><span>Tomorrow starts at <b id="tmr">100%</b></span></div>
  </section>

  <section class="card" style="animation:in 1s .2s cubic-bezier(.2,.8,.2,1) both">
    <h2>Log an activity</h2>
    <div class="chips" id="chips"></div>
    <input type="text" id="name" placeholder="What is it? e.g. Client call" maxlength="40" aria-label="Activity name">
    <div class="row"><span>Energy change</span><b id="amt">-15</b></div>
    <input type="range" id="range" min="-40" max="40" value="-15" aria-label="Energy change">
    <div class="proj" id="proj"></div>
    <label class="plan"><input type="checkbox" id="plan"> Plan it for later (counts toward the forecast only)</label>
    <button class="btn" id="add">Add to today</button>
  </section>

  <section class="card full" style="animation:in 1s .3s cubic-bezier(.2,.8,.2,1) both">
    <h2>Today's energy curve</h2>
    <svg id="chart" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
    <ul class="led" id="led"></ul>
    <div class="foot"><button class="ghost" id="undo">Undo last</button><button class="ghost" id="start">Starting energy</button><button class="ghost" id="clear">Start a new day</button></div>
    <div class="sdlg" id="sdlg" hidden><span>Start</span><input type="range" id="srange" min="0" max="100" aria-label="Starting energy"><b id="sval"></b></div>
  </section>
  <section class="card full"><h2>Insights</h2><div class="stats" id="stats"></div><h2 style="margin-top:26px">Last 7 days</h2><div class="week" id="week"></div>
  <h2 style="margin-top:26px">Weekly report</h2><div class="rep" id="rep"></div>
  </section>
</div>
</div>

<div class="modal" id="modal" hidden><div class="card mbox"><h2 id="mt">Sign in</h2>
<input class="fld" type="email" id="em" placeholder="Email" autocomplete="email">
<input class="fld" type="password" id="pw" placeholder="Password (8+ characters)" autocomplete="current-password">
<div class="merr" id="merr" role="alert"></div>
<button class="btn" id="go">Sign in</button><button class="mlink" id="sw">New here? Create an account</button><button class="mlink" id="cancel">Not now</button></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const PRE=[["Deep work",-25],["Meeting",-15],["Workout",-12],["Doomscroll",-10],["Hard talk",-20],["Nap",18],["Walk",8],["Good meal",10],["Sleep-in",25]];
let S={start:100,items:[],hist:[]},newIdx=-1;
try{const r=JSON.parse(localStorage.getItem("reserve_v1")||"null");if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem("reserve_v1",JSON.stringify(S))}catch(e){}sync()};
const sum=a=>a.reduce((x,i)=>x+i.d,0),sgn=v=>(v>0?"+":"")+v;
const level=()=>S.start+sum(S.items.filter(i=>!i.p)),fcast=()=>S.start+sum(S.items);
const carry=L=>L<0?Math.max(40,Math.round(100+L*.5)):100;
const now=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
$("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"});
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function floatD(d){const r=$("rb"),s=document.createElement("span");s.className="fl "+(d>0?"p":"n");s.textContent=sgn(d);r.appendChild(s);setTimeout(()=>s.remove(),1500);r.classList.remove("pulse");void r.offsetWidth;r.classList.add("pulse")}

// ambient field: drifting dust that lights up near the cursor, smoothed glow
const cv=$("fx"),cx=cv.getContext("2d"),g=$("glow"),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W,H,P=[],gx=innerWidth/2,gy=240,tx=gx,ty=gy;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(80,W/14|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,v:Math.random()*.25+.05,a:Math.random()*.4+.1}))}
size();addEventListener("resize",()=>{size();chart()});
(function loop(){gx+=(tx-gx)*.08;gy+=(ty-gy)*.08;g.style.left=gx+"px";g.style.top=gy+"px";cx.clearRect(0,0,W,H);cx.fillStyle="#fff";
P.forEach(p=>{if(!RM)p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}const d=Math.hypot(p.x-gx,p.y-gy),b=d<230?1-d/230:0;cx.globalAlpha=Math.min(1,p.a+b*.7);cx.beginPath();cx.arc(p.x,p.y,p.r+b*1.3,0,6.283);cx.fill()});requestAnimationFrame(loop)})();
addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;document.querySelectorAll(".card").forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")})});
const hero=document.querySelector(".hero");
hero.addEventListener("pointermove",e=>{const r=hero.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;hero.style.transform=`perspective(900px) rotateY(${x*7}deg) rotateX(${-y*7}deg)`});
hero.addEventListener("pointerleave",()=>hero.style.transform="");
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.chip,.ghost");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span"),z=Math.max(r.width,r.height)*2;s.className="rip";s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),700)});
addEventListener("keydown",e=>{if(e.key==="n"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("name").focus()}});

PRE.forEach(([n,d])=>{const b=document.createElement("button");b.className="chip";b.textContent=n+" "+sgn(d);b.onclick=()=>{$("name").value=n;$("range").value=d;upd()};$("chips").appendChild(b)});
function upd(){const d=+$("range").value;$("amt").textContent=sgn(d);const a=fcast()+d,p=$("proj");p.className="proj"+(a<0?" warn":"");
p.textContent=a<0?`You'd end the day at ${a}%, borrowing ${-a}% from tomorrow.`:`You'd end the day at ${a}%.`}
$("range").oninput=upd;$("plan").onchange=()=>{$("add").textContent=$("plan").checked?"Add to plan":"Add to today"};

let shown=0;function countTo(t){const f=shown,s=performance.now();(function k(n){const q=Math.min(1,(n-s)/900),e=1-Math.pow(1-q,3);shown=Math.round(f+(t-f)*e);$("n").textContent=shown;if(q<1)requestAnimationFrame(k)})(s)}

function render(){
 const L=level(),F=fcast(),pct=Math.max(0,Math.min(100,L));
 $("bar").style.strokeDashoffset=540.35*(1-pct/100);$("tip").style.transform=`rotate(${pct*3.6}deg)`;
 $("ring").classList.toggle("debt",L<0);$("rb").classList.toggle("debt",L<0);countTo(L);
 const st=L>=70?["Surplus","You have room. Protect it for the thing that matters most."]:L>=40?["Steady","Healthy. One heavy task is fine, two is pushing it."]:L>=15?["Running low","Stop adding drains. Schedule a recharge before anything else."]:L>=0?["Nearly empty","One more drain puts you in debt. Rest is the productive move."]:["In debt","You've overdrawn today. Tomorrow will pay for it."];
 $("state").textContent=st[0];const v=$("verdict");if(v.textContent!==st[1]){v.style.opacity=0;setTimeout(()=>{v.textContent=st[1];v.style.opacity=1},250)}
 $("fc").textContent=F+"%";$("fc").style.color=F<0?"var(--red)":"";$("tmr").textContent=carry(F)+"%";
 chart();ledger();insights();week();
}
function chart(){
 const el=$("chart"),W=el.clientWidth||600,H=170;el.setAttribute("viewBox",`0 0 ${W} ${H}`);
 let c=S.start,pts=[{v:c}];[...S.items.filter(i=>!i.p),...S.items.filter(i=>i.p)].forEach(i=>{c+=i.d;pts.push({v:c,p:!!i.p})});
 const vs=pts.map(q=>q.v),lo=Math.min(0,...vs),hi=Math.max(100,...vs),y=v=>H-10-(v-lo)/(hi-lo)*(H-20),x=i=>pts.length<2?0:i/(pts.length-1)*W;
 const P=(a,b)=>pts.slice(a,b).map((q,k)=>(k?"L":"M")+x(a+k).toFixed(1)+" "+y(q.v).toFixed(1)).join(" ");
 let k=pts.findIndex((q,i)=>i&&q.p);if(k<0)k=pts.length;
 const last=k-1,lc=pts[last].v<0?"#e5484d":"#fafafa";
 el.innerHTML=`<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
 <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#e5484d" stroke-dasharray="4 6" opacity=".55"/>
 <path d="${P(0,k)} L${x(last)} ${H} L0 ${H}Z" fill="url(#ar)"/>
 <path d="${P(0,k)}" pathLength="1" fill="none" stroke="#fafafa" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke-dasharray:1;animation:dr 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))"/>
 ${k<pts.length?`<path d="${P(last,pts.length)}" fill="none" stroke="#8a8a90" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>`:""}
 <circle cx="${x(last)}" cy="${y(pts[last].v)}" r="5" fill="${lc}" style="filter:drop-shadow(0 0 8px ${lc})"/>
 <style>@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}</style>`;
}
function ledger(){
 const u=$("led");u.innerHTML="";
 if(!S.items.length)u.innerHTML='<li class="empty" style="justify-content:center;border:0">Nothing logged yet. Add your first activity to see where your energy goes.</li>';
 S.items.forEach((it,i)=>{const li=document.createElement("li");li.className=(it.p?"pl ":"")+(i===newIdx?"new":"");
  li.innerHTML=`<span class="nm"></span><span class="t">${it.p?"planned":it.t}</span><span class="d ${it.d>0?"pos":"neg"}">${sgn(it.d)}</span>${it.p?'<button class="ok" aria-label="Mark done">✓</button>':""}<button class="x" aria-label="Remove">×</button>`;
  li.querySelector(".nm").textContent=it.n;
  li.querySelector(".x").onclick=()=>{S.items.splice(i,1);newIdx=-1;save();render();upd()};
  const ok=li.querySelector(".ok");if(ok)ok.onclick=()=>{it.p=false;it.t=now();newIdx=-1;save();render();upd();floatD(it.d);toast("Done: "+it.n+" "+sgn(it.d))};
  u.appendChild(li)});
 u.scrollTop=u.scrollHeight;
}
function insights(){
 const agg=f=>{const m={};S.items.filter(f).forEach(i=>m[i.n]=(m[i.n]||0)+i.d);return Object.entries(m)};
 const dr=agg(i=>i.d<0).sort((a,b)=>a[1]-b[1])[0],rc=agg(i=>i.d>0).sort((a,b)=>b[1]-a[1])[0];
 let sk=0;for(let i=S.hist.length-1;i>=0&&S.hist[i].end>=0;i--)sk++;
 const T=[["Safe to spend",Math.max(0,fcast()-15)+"%","before the red zone"],["Biggest drain",dr?dr[0]:"None yet",dr?dr[1]+"% today":"nothing logged"],["Best recharge",rc?rc[0]:"None yet",rc?"+"+rc[1]+"% today":"nothing logged"],["Streak",sk+(sk===1?" day":" days"),"without an overdraft"]];
 $("stats").innerHTML=T.map(t=>`<div class="st"><small>${t[0]}</small><b></b><em>${t[2]}</em></div>`).join("");
 $("stats").querySelectorAll("b").forEach((b,i)=>b.textContent=T[i][1]);
}
function week(){
 const h=S.hist.slice(-7),el=$("week");el.innerHTML="";
 for(let i=0;i<7;i++){const e=h[i-(7-h.length)],d=document.createElement("div");d.className="wd";if(e)d.title=e.end+"%";
  d.innerHTML=`<div class="bw"><i style="height:${e?Math.max(7,Math.min(100,e.end)):7}%" class="${e?(e.end<0?"neg":"on"):""}"></i></div><small>${e?e.d:"·"}</small>`;el.appendChild(d)}
}
$("add").onclick=()=>{const d=+$("range").value,p=$("plan").checked;
 if(!d){$("proj").className="proj warn";$("proj").textContent="Move the slider. A change of 0 doesn't affect your energy.";return}
 const n=$("name").value.trim()||(d>0?"Recharge":"Drain"),before=level();
 S.items.push({n,d,p,t:now()});newIdx=S.items.length-1;$("name").value="";$("plan").checked=false;$("plan").onchange();
 save();render();upd();const L=level(),F=fcast();
 if(!p)floatD(d);
 toast(p&&F<0?`This plan overdraws your day by ${-F}%`:p?`Planned: ${n} ${sgn(d)}`:L<0?"Overdrawn. You're borrowing from tomorrow.":L<15&&before>=15?"Low reserve. Recharge next.":`Logged ${n} ${sgn(d)}`)};
$("name").addEventListener("keydown",e=>{if(e.key==="Enter")$("add").click()});
$("undo").onclick=()=>{const i=S.items.pop();if(!i)return toast("Nothing to undo");newIdx=-1;save();render();upd();toast("Removed "+i.n)};
$("start").onclick=()=>{const d=$("sdlg");d.hidden=!d.hidden;$("srange").value=S.start;$("sval").textContent=S.start+"%"};
$("srange").oninput=e=>{S.start=+e.target.value;$("sval").textContent=S.start+"%";save();render();upd()};
$("clear").onclick=()=>{const F=fcast();S.hist.push({d:new Date().toLocaleDateString(undefined,{weekday:"narrow"}),end:F});S.hist=S.hist.slice(-30);
 S.start=carry(F);S.items=[];newIdx=-1;save();render();upd();toast(`New day. Starting at ${S.start}%.`)};

// ---- optional account + sync: the app still works fully offline without signing in
let TOK=null;try{TOK=localStorage.getItem("reserve_tok")}catch(e){}
async function api(p,m="GET",b){const r=await fetch("/api"+p,{method:m,headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
let syncT;function sync(){if(!TOK)return;clearTimeout(syncT);syncT=setTimeout(()=>api("/state/current","PUT",{start:S.start,items:S.items}).catch(()=>toast("Offline. Changes are saved on this device.")),600)}
async function flush(){clearTimeout(syncT);await api("/state/current","PUT",{start:S.start,items:S.items})}
function who(){$("acct").textContent=TOK?"Sign out":"Sign in"}
function signOut(){TOK=null;try{localStorage.removeItem("reserve_tok")}catch(e){}who();loadReport()}
function applyState(st){S.start=st.current.start;S.items=st.current.items;S.hist=st.hist;newIdx=-1;try{localStorage.setItem("reserve_v1",JSON.stringify(S))}catch(e){}render();upd();loadReport()}
async function pull(){const st=await api("/state");if(!st.current.items.length&&S.items.length){await flush();st.current={start:S.start,items:S.items}}applyState(st)}
async function loadReport(){const el=$("rep");el.innerHTML="";if(!TOK){el.textContent="Sign in to sync across devices and get a weekly report.";return}
 try{const r=await api("/report/weekly");[...r.lines,r.tip].forEach((t,i)=>{const p=document.createElement("p");p.textContent=t;if(i===r.lines.length)p.style.color="var(--w)";el.appendChild(p)})}catch(e){el.textContent="Report unavailable right now."}}
let mode="login";
function setMode(m){mode=m;$("mt").textContent=m==="login"?"Sign in":"Create account";$("go").textContent=m==="login"?"Sign in":"Create account";$("sw").textContent=m==="login"?"New here? Create an account":"Have an account? Sign in";$("pw").autocomplete=m==="login"?"current-password":"new-password";$("merr").textContent=""}
$("acct").onclick=()=>{if(TOK){signOut();toast("Signed out. Your data stays on the server.");return}setMode("login");$("modal").hidden=false;$("em").focus()};
$("sw").onclick=()=>setMode(mode==="login"?"register":"login");
$("cancel").onclick=()=>{$("modal").hidden=true};
$("go").onclick=async()=>{try{const r=await api("/auth/"+mode,"POST",{email:$("em").value.trim(),password:$("pw").value});TOK=r.token;try{localStorage.setItem("reserve_tok",TOK)}catch(e){}$("modal").hidden=true;$("pw").value="";who();await pull();toast("Signed in. Your days now sync.")}catch(e){$("merr").textContent=e.message}};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
const localClear=$("clear").onclick;
$("clear").onclick=async()=>{if(!TOK)return localClear();try{await flush();applyState(await api("/state/close","POST"));toast(`New day. Starting at ${S.start}%.`)}catch(e){toast(e.message)}};
who();
if(TOK)pull().catch(e=>{if(/token/i.test(e.message))signOut();else loadReport()});else loadReport();
render();upd();
</script>
</body>
